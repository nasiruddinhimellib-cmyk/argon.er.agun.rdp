name: Fast RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Optimize System & Configure Fast RDP
        run: |
          $ProgressPreference = 'SilentlyContinue';
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c;
          Stop-Service -Name "WSearch", "SysMain", "wuauserv", "DiagTrack" -Force -ErrorAction SilentlyContinue;
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "MenuShowDelay" -Value "0" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2 -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force;
          $tsPolicies = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services';
          if (-not (Test-Path "$tsPolicies")) { New-Item -Path "$tsPolicies" -Force | Out-Null };
          Set-ItemProperty -Path "$tsPolicies" -Name "VGOptimization" -Value 1 -Force;
          Set-ItemProperty -Path "$tsPolicies" -Name "AVC444ModePreferred" -Value 1 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -Value 15 -Force;
          netsh advfirewall firewall delete rule name="RDP-Tailscale-TCP" | Out-Null;
          netsh advfirewall firewall delete rule name="RDP-Tailscale-UDP" | Out-Null;
          netsh advfirewall firewall add rule name="RDP-Tailscale-TCP" dir=in action=allow protocol=TCP localport=3389 | Out-Null;
          netsh advfirewall firewall add rule name="RDP-Tailscale-UDP" dir=in action=allow protocol=UDP localport=3389 | Out-Null;
          Restart-Service -Name TermService -Force;

      - name: Setup RDP User & Startup Script
        run: |
          $ProgressPreference = 'SilentlyContinue';
          net accounts /maxpwage:unlimited;
          net user RDP "HELLO.hello0011" /add /Y /EXPIRES:NEVER;
          net localgroup Administrators RDP /add;
          net localgroup "Remote Desktop Users" RDP /add;
          $commonStartup = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp";
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat";
          $downloadPath = "$commonStartup\Downloads.bat";
          try {
              Invoke-WebRequest -Uri "$downloadUrl" -OutFile "$downloadPath" -UseBasicParsing;
              Write-Host "Downloads.bat placed in Common Startup folder.";
          } catch {
              Write-Host "Warning: Could not fetch Downloads.bat";
          };

      - name: Install & Connect Tailscale
        run: |
          $ProgressPreference = 'SilentlyContinue';$tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi";
          $installerPath = "$env:TEMP\tailscale.msi";
          Invoke-WebRequest -Uri "$tsUrl" -OutFile "$installerPath" -UseBasicParsing;
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait;
          Remove-Item -Path "$installerPath" -Force;
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --accept-dns=false --unattended;
          $tsIP =$null;
          for ($i = 0; $i -lt 15; $i++) {$tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null);
              if ($tsIP) { break };
              Start-Sleep -Seconds 2;
          };
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned.";
              exit 1;
          };
          Add-Content -Path "$env:GITHUB_ENV" -Value "TAILSCALE_IP=$tsIP";

      - name: RDP Ready & Keep Alive
        run: |
          Write-Host "==========================================";
          Write-Host "RDP IS READY FOR CONNECTION";
          Write-Host "Address  : $env:TAILSCALE_IP";
          Write-Host "Username : RDP";
          Write-Host "Password : HELLO.hello0011";
          Write-Host "==========================================";
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Runner active...";
              Start-Sleep -Seconds 300;
          };
